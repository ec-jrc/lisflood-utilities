[build-system]
requires = ["setuptools>=41.0", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "lisflood-utilities"
requires-python = ">=3.10"
version = "0.11.7"  # Will be read from VERSION file at build time
description = "A set of utilities for lisflood users. pcr2nc: Convert PCRaster files to netCDF CF 1.6; nc2pcr: Convert netCDF files to PCRaster format; cutmaps: cut netCDF files; compare: compare two set of netCDF files; thresholds: compute discharge return period thresholds; gridding: interpolate meteo variables observations; decumulate: decumulate daily grids into 6 hourly grids in kiwis format; ncextract: extract values from netCDF files; catchstats: calculates catchment statistics; mctrivers: creates a river mask for MCT diffusive river routing in LISFLOOD; "
readme = "README.md"
license = {text = "EUPL 1.2"}
authors = [
    {name = "Valerio Lorini", email = "valerio.lorini@ec.europa.eu"},
    {name = "Stefania Grimaldi", email = "stefania.grimaldi@ec.europa.eu"},
    {name = "Carlo Russo", email = "carlo.russo@ext.ec.europa.eu"},
    {name = "Goncalo Gomes", email = "goncalo.ramos-gomes@ext.ec.europa.eu"},
    {name = "Domenico Nappo", email = "domenico.nappo@gmail.com"},
    {name = "Lorenzo Alfieri", email = "lorenzo.alfieri@ec.europa.eu"},
]
keywords = ["netCDF4", "PCRaster", "mapstack", "lisflood", "efas", "glofas", "ecmwf", "copernicus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Other Audience",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "pyyaml>=5.4",
    "netCDF4>=1.5.3",
    "toolz",
    "xarray>=0.15.1",
    "dask",
    "pandas>=0.25.1",
    "pyg2p",
    "gdal<=3.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
pcr2nc = "lisfloodutilities.pcr2nc.main:main_script"
cutmaps = "lisfloodutilities.cutmaps.main:main_script"
compare = "lisfloodutilities.compare.main:main_script"
nc2pcr = "lisfloodutilities.nc2pcr.main:main_script"
thresholds = "lisfloodutilities.thresholds:main_script"
gridding = "lisfloodutilities.gridding.generate_grids:main_script"
decumulate = "lisfloodutilities.gridding.decumulate_daily_grids:main_script"
cddmap = "lisfloodutilities.cddmap.cddmap:main"
ncextract = "lisfloodutilities.ncextract:main_script"
catchstats = "lisfloodutilities.catchstats:main_script"
mctrivers = "lisfloodutilities.mctrivers.mctrivers:main"

[project.urls]
Homepage = "https://github.com/ec-jrc/lisflood-utilities"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lisfloodutilities = ["VERSION"]